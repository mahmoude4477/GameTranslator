<!-- GameTranslator OBS katmanı: OBS'de "Tarayıcı kaynağı" olarak eklenir, Türkçe altyazıyı şeffaf zemin üstünde gösterir.
     Mac ve Windows uygulaması bu dosyayı /obs adresinden verir (aynı dosya). Adres parametreleri:
     ?size=48 (yazı boyu, 1080p'de piksel), ?bottom=8 (alttan uzaklık, %), ?bg=60 (zemin koyuluğu, 0-100). -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameTranslator Overlay</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #line {
    position: absolute; left: 50%; bottom: 7%; transform: translateX(-50%);
    max-width: 84vw; padding: 0.25em 0.6em; border-radius: 0.3em;
    font: 600 4.4vh/1.3 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #fff; text-align: center; white-space: pre-line;
    text-shadow: 0 0 0.12em #000, 0 0.06em 0.12em #000;
    background: rgba(0, 0, 0, 0.6);
    opacity: 0; transition: opacity 0.15s;
  }
  #line.on { opacity: 1; }
  /* İngilizce altyazının yeri biliniyorsa çeviri onu örter (TV'deki "örtme" ile aynı). */
  #line.cover { transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="line"></div>
<script>
(function () {
  var line = document.getElementById('line');
  var params = new URLSearchParams(location.search);
  var fixed = { size: params.get('size'), bottom: params.get('bottom'), bg: params.get('bg') };
  var timer = null;
  var placement = 'cover';
  var lastStyle = {};

  function apply(style) {
    style = style || {};
    lastStyle = style;
    var size = Number(fixed.size || style.fontSize);
    if (size > 0) line.style.fontSize = (size / 10.8) + 'vh';
    var bottom = Number(fixed.bottom || style.bottomPercent);
    if (bottom >= 0 && bottom <= 85) line.style.bottom = bottom + '%';
    var bg = fixed.bg !== null ? Number(fixed.bg) : style.background;
    if (typeof bg === 'number' && !isNaN(bg)) line.style.background = 'rgba(0, 0, 0, ' + Math.max(0, Math.min(100, bg)) / 100 + ')';
    if (typeof style.bold === 'boolean') line.style.fontWeight = style.bold ? '700' : '600';
    if (style.placement) placement = style.placement;
  }

  function hide() {
    clearTimeout(timer);
    line.className = '';
  }

  function show(text, duration, box) {
    clearTimeout(timer);
    line.textContent = text;
    // Arapça ve İbranice gibi diller sağdan sola dizilir (TV uygulamasıyla aynı kural).
    line.setAttribute('dir', /[\u0590-\u08FF\uFB1D-\uFDFF\uFE70-\uFEFC]/.test(text || '') ? 'rtl' : 'ltr');
    var cover = box && placement === 'cover' && !fixed.bottom;
    if (cover) {
      line.style.left = ((box.left + box.right) / 2 * 100) + '%';
      line.style.top = ((box.top + box.bottom) / 2 * 100) + '%';
      line.style.bottom = 'auto';
      line.style.minWidth = ((box.right - box.left) * 100) + 'vw';
      line.style.background = 'rgba(0, 0, 0, 0.97)';
    } else {
      line.style.left = '50%';
      line.style.top = 'auto';
      line.style.minWidth = '';
      apply(lastStyle);
    }
    line.className = text ? (cover ? 'on cover' : 'on') : '';
    timer = setTimeout(hide, Math.max(1000, duration || 8000));
  }

  apply({});
  // "obs" parametresi uygulamaya bunun TV olmadığını söyler; "TV bağlı" sayısına katılmaz.
  var events = new EventSource('/events?viewer=obs');
  events.addEventListener('style', function (e) { try { apply(JSON.parse(e.data)); } catch (err) {} });
  events.addEventListener('subtitle', function (e) {
    try { var d = JSON.parse(e.data); show(d.text, d.duration, d.box); } catch (err) {}
  });
  events.addEventListener('clear', hide);
})();
</script>
</body>
</html>
