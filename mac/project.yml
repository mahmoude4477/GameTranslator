name: GameTranslator
options:
  bundleIdPrefix: com.gametranslator
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    # libchiaki ve bağımlılıkları yalnız Apple Silicon için derleniyor.
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  GameTranslatorCore:
    path: ../core
  RemotePlay:
    path: ../remoteplay
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  GameTranslator:
    type: application
    platform: macOS
    sources:
      - GameTranslator
      # Tasarım değerleri: Windows sürümüyle ortak tek kaynak.
      - path: ../design/tokens.json
        buildPhase: resources
      # TV uygulaması paketi (scripts/package-tv.sh üretir; yoksa kurulum özelliği gizlenir).
      - path: ../dist/tv-app
        type: folder
        optional: true
        buildPhase: resources
      # Samsung ve Android TV kurulum yardımcısı (scripts/build-tv-helper.sh üretir, package-mac.sh imzalar).
      - path: ../dist/tv-helper/gametranslator-tv-helper
        optional: true
        buildPhase:
          copyFiles:
            destination: executables
      # Türkçe dublajın ses motoru (scripts/fetch-pocket-tts.sh indirir, package-mac.sh imzalar).
      - path: ../dist/tts/pocket-tts
        optional: true
        buildPhase:
          copyFiles:
            destination: executables
    dependencies:
      - package: GameTranslatorCore
      - package: RemotePlay
      - package: Sparkle
    info:
      path: GameTranslator/Info.plist
      properties:
        CFBundleDisplayName: GameTranslator
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: GameTranslator finds your PS5 and TV on the local network to send translated subtitles.
        NSHumanReadableCopyright: AGPL-3.0. Uses chiaki-ng (AGPL-3.0).
        SUFeedURL: https://github.com/Sefflex/GameTranslate/releases/latest/download/appcast.xml
        SUPublicEDKey: GRsdOlnDQSm2yPnUTF/VoD/0202u2J0GPmJ8CCzVdfc=
        SUEnableAutomaticChecks: true
    entitlements:
      path: GameTranslator/GameTranslator.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gametranslator.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GameTranslatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GameTranslatorTests
    dependencies:
      - target: GameTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gametranslator.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GameTranslator.app/Contents/MacOS/GameTranslator"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GameTranslator:
    build:
      targets:
        GameTranslator: all
        GameTranslatorTests: [test]
    test:
      targets:
        - GameTranslatorTests
