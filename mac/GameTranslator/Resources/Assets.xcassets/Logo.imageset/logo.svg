<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- macOS standard 824x824 squircle -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bgGrad)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#2563EB" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Modern Gaming Controller Body -->
  <g transform="translate(512, 450)">
    <!-- Controller Main Shell -->
    <path d="M-220,-80 C-140,-130 140,-130 220,-80 C260,-55 280,40 260,150 C245,230 180,260 130,220 C100,195 80,120 0,120 C-80,120 -100,195 -130,220 C-180,260 -245,230 -260,150 C-280,40 -260,-55 -220,-80 Z" 
          fill="url(#controllerGrad)" />

    <!-- Grip Accents / Highlights -->
    <path d="M-200,-50 C-130,-90 130,-90 200,-50" fill="none" stroke="#60A5FA" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

    <!-- Left D-Pad -->
    <g transform="translate(-130, 20)">
      <rect x="-14" y="-42" width="28" height="84" rx="8" fill="#0F172A"/>
      <rect x="-42" y="-14" width="84" height="28" rx="8" fill="#0F172A"/>
      <circle cx="0" cy="0" width="16" fill="#38BDF8" r="6"/>
    </g>

    <!-- Right Action Buttons -->
    <g transform="translate(130, 20)">
      <circle cx="0" cy="-28" r="12" fill="#0F172A"/>
      <circle cx="28" cy="0" r="12" fill="#0F172A"/>
      <circle cx="0" cy="28" r="12" fill="#0F172A"/>
      <circle cx="-28" cy="0" r="12" fill="#0F172A"/>
      <!-- Glowing button indicators -->
      <circle cx="0" cy="-28" r="6" fill="#38BDF8"/>
      <circle cx="28" cy="0" r="6" fill="#60A5FA"/>
      <circle cx="0" cy="28" r="6" fill="#93C5FD"/>
      <circle cx="-28" cy="0" r="6" fill="#38BDF8"/>
    </g>

    <!-- Dual Analog Thumbsticks -->
    <g transform="translate(-65, 90)">
      <circle cx="0" cy="0" r="32" fill="#0F172A"/>
      <circle cx="0" cy="0" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    </g>
    <g transform="translate(65, 90)">
      <circle cx="0" cy="0" r="32" fill="#0F172A"/>
      <circle cx="0" cy="0" r="26" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    </g>

    <!-- Center Touchpad / Translation Display -->
    <rect x="-60" y="-80" width="120" height="70" rx="14" fill="#0A0F1D" stroke="#38BDF8" stroke-width="3"/>
    
    <!-- Audio Waveform / Translation Wave -->
    <g stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round">
      <line x1="-36" y1="-45" x2="-36" y2="-45"/>
      <line x1="-24" y1="-52" x2="-24" y2="-38"/>
      <line x1="-12" y1="-58" x2="-12" y2="-32"/>
      <line x1="0" y1="-62" x2="0" y2="-28"/>
      <line x1="12" y1="-58" x2="12" y2="-32"/>
      <line x1="24" y1="-52" x2="24" y2="-38"/>
      <line x1="36" y1="-45" x2="36" y2="-45"/>
    </g>
  </g>

  <!-- Real-Time Subtitle Bar Overlay at Bottom -->
  <g transform="translate(512, 740)">
    <rect x="-240" y="-36" width="480" height="72" rx="20" fill="#0F172A" fill-opacity="0.9" stroke="#3B82F6" stroke-width="3"/>
    <!-- Two Subtitle Lines -->
    <rect x="-180" y="-18" width="220" height="12" rx="6" fill="#FFFFFF"/>
    <rect x="60" y="-18" width="120" height="12" rx="6" fill="#38BDF8"/>
    <rect x="-140" y="6" width="280" height="12" rx="6" fill="#93C5FD"/>
  </g>
</svg>